<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico de datos — JR Control</title>
<style>
  body{font-family:system-ui,sans-serif;background:#05070B;color:#e8ecf1;margin:0;padding:16px;max-width:560px;margin:auto;line-height:1.45}
  h1{font-size:20px;margin:0 0 4px} h2{font-size:16px;margin:22px 0 8px;color:#6ee7b7}
  .box{background:#0f1520;border:1px solid #1e2a3a;border-radius:10px;padding:12px;margin-bottom:10px;font-size:14px;overflow-x:auto}
  button{background:#0a7a55;color:#fff;border:0;border-radius:8px;padding:12px 14px;font-size:15px;width:100%;margin:6px 0}
  button.sec{background:#243247}
  table{border-collapse:collapse;width:100%;font-size:13px} td,th{padding:4px 6px;border-bottom:1px solid #1e2a3a;text-align:left}
  .ok{color:#6ee7b7}.mal{color:#fca5a5}.av{color:#fcd34d}
  small{color:#8a97a8}
</style>
</head>
<body>
<h1>Diagnóstico de datos</h1>
<small>Solo lee y compara. No modifica ni borra nada, ni en el teléfono ni en Firebase.</small>

<button id="btnRun">1. Revisar mis datos</button>
<div id="out"></div>

<h2>Respaldos</h2>
<button class="sec" id="btnLocal">Descargar respaldo de ESTE teléfono</button>
<button class="sec" id="btnRemoto">Descargar respaldo de FIREBASE</button>
<small>Los archivos tienen el mismo formato que «Exportar» en la app, así que se pueden importar después. Guárdalos antes de tocar cualquier otra cosa.</small>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
var KEYS=['cvd_data','cvd_productos','cvd_pedidos','cvd_encargos','cvd_clientes','cvd_fondos','cvd_eliminados'];
var out=document.getElementById('out');
var remotoCache=null;

function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function add(html){var d=document.createElement('div');d.className='box';d.innerHTML=html;out.appendChild(d);}
function kb(n){return (n/1024).toFixed(0)+' KB';}

function resumenData(d){
  var dias=Object.keys(d||{}).sort(), v=0,g=0,p=0,montoV=0;
  dias.forEach(function(k){var x=d[k]||{};v+=(x.ventas||[]).length;g+=(x.gastos||[]).length;p+=(x.pedidos||[]).length;
    (x.ventas||[]).forEach(function(r){montoV+=parseFloat(r.monto)||0;});});
  return {dias:dias,ventas:v,gastos:g,pedidos:p,montoV:montoV,primero:dias[0]||'—',ultimo:dias[dias.length-1]||'—'};
}
function filaRes(t,r){
  return '<tr><td>'+t+'</td><td>'+r.dias.length+' días</td><td>'+r.ventas+' ventas</td><td>'+r.gastos+' gastos</td></tr>';
}
function idsDe(d){var s={};Object.keys(d||{}).forEach(function(f){var x=d[f]||{};
  ['ventas','gastos','pedidos','extra'].forEach(function(t){(x[t]||[]).forEach(function(r){s[f+'|'+t+'|'+r.id]=1;});});});return s;}

function revisarLocal(){
  var html='<b>📱 Este teléfono (localStorage)</b><table><tr><th>Clave</th><th>Tamaño</th><th>Estado</th></tr>';
  var total=0, parsed={};
  KEYS.forEach(function(k){
    var s=localStorage.getItem(k);
    if(s===null){html+='<tr><td>'+k+'</td><td>—</td><td class="av">no existe</td></tr>';return;}
    total+=s.length;
    try{parsed[k]=JSON.parse(s);html+='<tr><td>'+k+'</td><td>'+kb(s.length*2)+'</td><td class="ok">ok</td></tr>';}
    catch(e){html+='<tr><td>'+k+'</td><td>'+kb(s.length*2)+'</td><td class="mal">DAÑADO</td></tr>';}
  });
  html+='</table>';
  // espacio total usado por TODO el sitio (otras apps del mismo github.io comparten cuota)
  var todo=0,otros=[];
  for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);var n=(localStorage.getItem(k)||'').length;todo+=n;if(KEYS.indexOf(k)<0&&n>50000)otros.push(k+' ('+kb(n*2)+')');}
  html+='<p>Uso total del sitio: <b>'+kb(todo*2)+'</b> de ~5 000–10 000 KB posibles.</p>';
  if(otros.length) html+='<p class="av">Otras claves grandes en este mismo sitio: '+esc(otros.join(', '))+'</p>';
  // prueba de escritura
  try{var prueba=new Array(200001).join('x');localStorage.setItem('__prueba',prueba);localStorage.removeItem('__prueba');
    html+='<p class="ok">Prueba de espacio: se puede escribir (400 KB libres como mínimo).</p>';}
  catch(e){html+='<p class="mal"><b>⚠ El almacenamiento está LLENO.</b> La app no puede guardar localmente: esto por sí solo explica registros que desaparecen al reabrir.</p>';}
  if(parsed.cvd_data){var r=resumenData(parsed.cvd_data);
    html+='<table>'+filaRes('Local',r)+'</table><p>Primer día: '+r.primero+' · Último día: '+r.ultimo+'</p>';}
  add(html);
  return parsed;
}

function leerRemoto(){
  firebase.initializeApp({apiKey:"AIzaSyA3Y95NMaWUpKGjoVJZ3Mdc9MA-7p2QWPw",authDomain:"jrventa-72523.firebaseapp.com",projectId:"jrventa-72523"});
  var db=firebase.firestore();
  return db.doc('negocio/principal').get().then(function(doc){
    if(!doc.exists) throw new Error('El documento negocio/principal NO existe en Firebase.');
    var d=doc.data(), info={doc:d,str:null,n:0};
    if(d.data){ info.str=d.data; return info; }
    var n=d.dataChunks||0; info.n=n;
    var ps=[];for(var i=0;i<n;i++)ps.push(db.doc('negocio/datos_'+i).get());
    return Promise.all(ps).then(function(docs){
      var s='',faltan=[];
      docs.forEach(function(x,i){if(!x.exists)faltan.push(i);else s+=(x.data().p||'');});
      info.faltan=faltan;info.str=s;return info;
    });
  });
}

function revisarRemoto(localParsed){
  return leerRemoto().then(function(info){
    remotoCache=info;
    var d=info.doc, html='<b>☁ Firebase</b>';
    var upd=d.updatedAt&&d.updatedAt.toDate?d.updatedAt.toDate().toLocaleString():'—';
    html+='<p>Última escritura: <b>'+upd+'</b> · Trozos de historial: '+info.n+'</p>';
    if(info.faltan&&info.faltan.length) html+='<p class="mal">⚠ Faltan trozos en Firebase: '+info.faltan.join(', ')+'</p>';
    var obj=null;
    try{obj=JSON.parse(info.str);}catch(e){html+='<p class="mal"><b>⚠ El historial en Firebase está DAÑADO</b> (los trozos se mezclaron). Sincronizar falla mientras esto siga así. Descarga el respaldo de este teléfono antes de hacer cualquier cosa.</p>';}
    if(obj){
      var r=resumenData(obj);
      html+='<table>'+filaRes('Firebase',r)+'</table><p>Primer día: '+r.primero+' · Último día: '+r.ultimo+'</p>';
      if(localParsed.cvd_data){
        var a=idsDe(localParsed.cvd_data), b=idsDe(obj), soloRemoto=0, soloLocal=0;
        Object.keys(b).forEach(function(k){if(!a[k])soloRemoto++;});
        Object.keys(a).forEach(function(k){if(!b[k])soloLocal++;});
        html+='<p>Registros que están en Firebase pero NO en este teléfono: <b class="'+(soloRemoto?'av':'ok')+'">'+soloRemoto+'</b><br>'+
              'Registros que están en este teléfono pero NO en Firebase: <b class="'+(soloLocal?'av':'ok')+'">'+soloLocal+'</b></p>';
      }
    }
    add(html);
  });
}

document.getElementById('btnRun').onclick=function(){
  out.innerHTML='';
  var p=revisarLocal();
  add('Consultando Firebase…');
  revisarRemoto(p).then(function(){out.removeChild(out.children[1]);}).catch(function(e){
    out.removeChild(out.children[1]);
    add('<span class="mal">No se pudo leer Firebase: '+esc(e.message||e.code||e)+'</span>');
  });
};

function bajar(nombre,obj){
  var blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nombre;a.click();
}
var hoy=new Date().toISOString().slice(0,10);
document.getElementById('btnLocal').onclick=function(){
  var b={};KEYS.forEach(function(k){b[k]=localStorage.getItem(k);});b.exportado=new Date().toISOString();
  bajar('respaldo_TELEFONO_'+hoy+'.json',b);
};
document.getElementById('btnRemoto').onclick=function(){
  (remotoCache?Promise.resolve(remotoCache):leerRemoto()).then(function(info){
    var d=info.doc;
    bajar('respaldo_FIREBASE_'+hoy+'.json',{
      cvd_data:info.str,cvd_productos:d.productos||null,cvd_pedidos:d.pedidos||null,cvd_encargos:d.encargos||null,
      cvd_clientes:d.clientes||null,cvd_fondos:d.fondos||null,cvd_eliminados:d.eliminados||null,exportado:new Date().toISOString()});
  }).catch(function(e){alert('No se pudo leer Firebase: '+(e.message||e));});
};
</script>
</body>
</html>
